<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redirecting | Beautiful Souls</title>
  <script>
    const params = new URLSearchParams(location.search);
    const target = new URL('framework.html', location.href);

    if (article) target.searchParams.set('article', article);
    location.replace(target.href);
  </script>
